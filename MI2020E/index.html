<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ôn tập MI2020E</title><link rel="stylesheet" href="../vendor/katex.min.css"><link rel="stylesheet" href="../style.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem('xstk-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{}</script><script defer src="../vendor/katex.min.js"></script><script defer src="../vendor/contrib/auto-render.min.js"></script><script defer src="../MI2020E/data.js"></script><script defer src="../app.js"></script></head><body>
<main><div class="topbar"><a href="../index.html" class="secondary">← Chọn môn</a><button id="back" class="secondary" hidden>← Chọn bộ câu hỏi</button><span id="save-note" role="status"></span><button id="theme" class="secondary" aria-label="Đổi giao diện">Dark mode</button></div>
<section id="setup" class="setup panel"><h1>Ôn tập MI2020E</h1><label for="chapter">Bộ câu hỏi</label><select id="chapter"><option value="all">Tổng hợp · 79 câu</option></select><label class="shuffle-label"><input type="checkbox" id="shuffle"> Xáo trộn câu hỏi và đáp án</label><button id="start" class="primary">Bắt đầu</button><button id="resume" class="secondary" hidden>Tiếp tục bài đang làm</button></section>
<section id="exam" hidden><div class="exam-bar"><div class="timer"><strong id="timer">00:00:00</strong><button id="pause" aria-label="Tạm dừng thời gian">Ⅱ</button></div><button class="text-button" id="reset">Làm lại</button></div><div class="layout"><section class="question-card" aria-label="Câu hỏi"><div id="question"></div><div class="navigation"><button id="prev" class="secondary">← Câu trước</button><button id="confirm" class="primary">Xác nhận</button><button id="next" class="secondary">Câu sau →</button></div></section><aside><section class="panel"><div class="panel-title"><h2>Tiến độ</h2><span id="percent">0%</span></div><div class="progress"><div id="progress"></div></div><div class="stats"><div><strong id="done">0/79</strong><span>Đã làm</span></div><div><strong id="right">0</strong><span>Đúng</span></div><div><strong id="wrong">0</strong><span>Sai</span></div></div><hr><nav id="grid" aria-label="Danh sách câu hỏi"></nav><div class="legend"><span><i></i>Chưa làm</span><span><i class="filled"></i>Đã làm</span><span><i class="active"></i>Đang xem</span></div><div id="complete" role="status"></div></section></aside></div></section>
<dialog id="reset-dialog"><h2>Làm lại bài?</h2><p>Kết quả và thời gian hiện tại sẽ được xóa. Nếu bật xáo trộn, thứ tự sẽ được trộn lại.</p><div><button id="cancel-reset" class="secondary">Hủy</button><button id="accept-reset" class="primary">Làm lại</button></div></dialog></main></body></html>
