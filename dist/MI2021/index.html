<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ôn tập MI2021</title><link rel="stylesheet" href="../vendor/katex.min.css?v=19095127357e"><link rel="stylesheet" href="../style.css?v=643e58ddbe35"><script>try{document.documentElement.dataset.theme=localStorage.getItem('xstk-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{}</script><script defer src="../vendor/katex.min.js?v=e8d885505949"></script><script defer src="../vendor/contrib/auto-render.min.js?v=bb53eb953394"></script><script defer src="../MI2021/data.js?v=25f7018f38c2"></script><script defer src="../app.js?v=8617e5b6311a"></script></head><body>
<main><div class="topbar"><a href="../index.html" class="secondary">← Chọn môn</a><button id="back" class="secondary" hidden>← Chọn bộ câu hỏi</button><span id="save-note" role="status"></span><button id="theme" class="secondary" aria-label="Đổi giao diện">Dark mode</button></div>
<section id="setup" class="setup panel"><h1>Ôn tập MI2021</h1><fieldset id="chapter-picker"><legend>Bộ câu hỏi</legend>
<div id="chapter-checks"></div>
<label class="chapter-choice chapter-all"><input type="checkbox" id="select-all"><span>Tất cả</span></label>
<p id="selection-count" class="source-ref"></p></fieldset>
<label class="shuffle-label"><input type="checkbox" id="shuffle"> Xáo trộn câu hỏi và đáp án</label><button id="start" class="primary">Bắt đầu</button><button id="resume" class="secondary" hidden>Tiếp tục bài đang làm</button><button id="resume-wrong" class="secondary" hidden>Tiếp tục ôn câu sai</button></section>
<section id="exam" hidden><div class="exam-bar"><div class="timer"><strong id="timer">00:00:00</strong><button id="pause" aria-label="Tạm dừng thời gian">Ⅱ</button></div><button id="retry-wrong" class="secondary" disabled>Làm lại câu sai</button><button class="text-button" id="reset">Làm lại</button></div><div class="layout"><section class="question-card" aria-label="Câu hỏi"><div id="question"></div><div class="navigation"><button id="prev" class="secondary">← Câu trước</button><button id="confirm" class="primary">Xác nhận</button><button id="next" class="secondary">Câu sau →</button></div></section><aside><section class="panel"><div class="panel-title"><h2>Tiến độ</h2><span id="percent">0%</span></div><div class="progress"><div id="progress"></div></div><div class="stats"><div><strong id="done">0/60</strong><span>Đã làm</span></div><div><strong id="right">0</strong><span>Đúng</span></div><div><strong id="wrong">0</strong><span>Sai</span></div></div><hr><nav id="grid" aria-label="Danh sách câu hỏi"></nav><div class="legend"><span><i></i>Chưa làm</span><span><i class="filled"></i>Đã làm</span><span><i class="active"></i>Đang xem</span></div><div id="complete" role="status"></div></section></aside></div></section>
<dialog id="reset-dialog"><h2>Làm lại bài?</h2><p>Kết quả và thời gian hiện tại sẽ được xóa. Nếu bật xáo trộn, thứ tự sẽ được trộn lại.</p><div><button id="cancel-reset" class="secondary">Hủy</button><button id="accept-reset" class="primary">Làm lại</button></div></dialog></main></body></html>
